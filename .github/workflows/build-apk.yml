name: Build Yamaha Terima Motor Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Buat keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias yamaha \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass yamaha123 \
            -keypass yamaha123 \
            -dname "CN=Yamaha Terima Motor, OU=Mobile, O=Yamaha Terima Motor, L=Indonesia, ST=Indonesia, C=ID"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: yamaha123
          KEY_PASSWORD: yamaha123
          KEY_ALIAS: yamaha
        run: gradle --no-daemon assembleRelease

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Yamaha-Terima-Motor-Offline-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
